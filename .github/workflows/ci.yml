name: ci

on:
  push:
    branches: [main, phase3-native]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly soak: 200 daily loops on the built engine.
    - cron: "0 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  soak:
    name: nightly soak
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Soak (200 x create/run/table/delete)
        run: make soak

  native:
    name: native engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: cd engine-native && ./mvnw -B test
      - name: Package
        run: cd engine-native && ./mvnw -B -DskipTests package
      - name: Static checks
        run: |
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 scripts/check_repo.py
      - name: Golden structure
        run: python3 tests/goldens-native/runner.py --validate
      - name: Golden suite
        run: python3 tests/run_goldens.py
      - name: DuckDB extensions
        run: make extensions
      - name: Coverage suite
        run: make coverage
      - name: MCP launch tests
        run: python3 tests/test_mcp_launch.py
      - name: MCP unit tests
        run: python3 -m unittest discover -s tests -p 'test_mcp_*.py'
      - name: MCP recipe end-to-end
        run: python3 tests/mcp_recipe_e2e.py
      - name: MCP end-to-end
        run: python3 tests/mcp_e2e.py
      - name: Black-box smoke
        run: |
          java -Ddap.port=7861 -jar engine-native/target/dap-native.jar >/tmp/dap-native.log 2>&1 &
          native_pid=$!
          trap 'kill $native_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            if curl -fsS -m 1 http://127.0.0.1:7861/v1/health >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          python3 tests/native_smoke.py --base http://127.0.0.1:7861

  bench:
    name: bench gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build jar
        run: cd engine-native && ./mvnw -B -DskipTests package
      - name: Accuracy and token gate
        run: |
          python3 tests/p6_bench.py \
            --manifest tests/p6_bench_manifest.example.json \
            --data-dir build/p6-bench/data \
            --out build/p6-bench/gate \
            --start \
            --reference tests/p6_bench_reference.json \
            --gate tests/p6_bench_gate.json \
            --java "$JAVA_HOME/bin/java"
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-bench-gate
          path: build/p6-bench/gate
