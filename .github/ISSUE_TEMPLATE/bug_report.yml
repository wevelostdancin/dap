name: Bug report
description: Report a reproducible problem with DAP
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first.
        Do not report security vulnerabilities here; follow SECURITY.md and use private reporting instead.

  - type: input
    id: version
    attributes:
      label: DAP version
      description: Output of 'dap doctor' or the contents of VERSION.
      placeholder: '1.3.0'
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      options:
        - x86_64
        - aarch64
        - Other
    validations:
      required: true

  - type: input
    id: java
    attributes:
      label: JDK version
      description: Output of 'java -version'. Write 'bundled' when using the jlink archive.
      placeholder: 'Temurin 21.0.13'
    validations:
      required: false

  - type: dropdown
    id: install
    attributes:
      label: How was DAP installed?
      options:
        - install.sh
        - Source build
        - dap-mcp install
        - DSH plugin
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and include the exact error message.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest workflow, command, or request that reproduces the issue.
      placeholder: |
        1. Start the engine with ...
        2. Send ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant output with secrets and personal data removed.
      render: shell
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Did you find a way to continue working? If so, how?
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing issue and checked the latest 1.3.x release.
          required: true
